<div class="container">
  <h1>Lista de Compras</h1>

  <form class="add-item-form" (ngSubmit)="adicionarItem()">
    <input type="text" [(ngModel)]="item" name="item" placeholder="Adicionar item..." required />
    <button type="submit">Adicionar</button>
  </form>

  <table class="shopping-list" *ngIf="lista.length > 0">
    <thead>
      <tr>
        <th>#</th>
        <th>Item</th>
        <th>Comprado</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of lista; let i = index">
        <td>{{ item.id }}</td>
        <td><span [class.item-riscado]="item.comprado">{{ item.nome }}</span></td>
        <td><input type="checkbox" [checked]="item.comprado" (click)="riscarItem(item)" /></td>
        <td><button (click)="removeItem(i)">Remover</button></td>
      </tr>
    </tbody>
  </table>
</div>
